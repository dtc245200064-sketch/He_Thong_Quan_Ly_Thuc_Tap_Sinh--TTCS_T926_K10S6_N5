<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Quản lý Thực tập sinh - Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Thư viện Font Awesome 6 Icons qua CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================================================================= -->
  <!-- MÀN HÌNH ĐĂNG NHẬP CHÍNH (CỔNG ĐĂNG NHẬP HỆ THỐNG)                -->
  <!-- ================================================================= -->
  <section id="login-view">
    <!-- Khung bao toàn màn hình đăng nhập -->
    <div class="wrapper">

      <!-- CỘT TRÁI: BANNER GIỚI THIỆU -->
      <div class="banner">
        <div class="banner-content">
          <!-- Logo -->
          <div class="logo">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="6" r="3"></circle>
              <path d="M5 20c0-4 3.5-7 7-7s7 3 7 7"></path>
              <path d="M19 10l2 2-2 2"></path>
            </svg>
          </div>

          <h1 class="slogan">
            KẾT NỐI TRI THỨC<br>
            <span>MỞ LỐI TƯƠNG LAI</span>
          </h1>
          <p class="slogan-desc">
            Đồng hành cùng thực tập sinh trên con đường phát triển và hội nhập quốc tế
          </p>

          <!-- 4 tính năng nhỏ -->
          <div class="features">
            <div class="feature-item">
              <span class="f-icon">
                <img src="image/users.svg" alt="Quản lý thực tập sinh">
              </span>
              <span>Quản lý<br>thực tập sinh</span>
            </div>
            <div class="feature-item">
              <span class="f-icon">
                <img src="image/building.svg" alt="Quản lý doanh nghiệp">
              </span>
              <span>Quản lý<br>doanh nghiệp</span>
            </div>
            <div class="feature-item">
              <span class="f-icon">
                <img src="image/clipboard.svg" alt="Theo dõi tiến độ">
              </span>
              <span>Theo dõi tiến độ<br>toàn diện</span>
            </div>
            <div class="feature-item">
              <span class="f-icon">
                <img src="image/chart.svg" alt="Báo cáo thống kê">
              </span>
              <span>Báo cáo<br>thống kê</span>
            </div>
          </div>
        </div>

        <!-- Ảnh sinh viên phía dưới -->
        <div class="banner-image">
          <img src="image/banner.jpg" alt="Thực tập sinh">
        </div>
      </div>

      <!-- CỘT PHẢI: FORM ĐĂNG NHẬP -->
      <div class="login-box">
        <!-- Icon ổ khóa phía trên -->
        <div class="lock-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>

        <h2 class="title">ĐĂNG NHẬP</h2>
        <p class="subtitle">Hệ thống quản lý thực tập sinh</p>

        <!-- 4 VAI TRÒ: HR & THỰC TẬP SINH HOẠT ĐỘNG, ADMIN & MASTER ĐANG PHÁT TRIỂN -->
        <div class="role-tabs">
          <button type="button" class="role-btn active" id="btnRoleHR" onclick="selectHRRole(this)">HR</button>
          <button type="button" class="role-btn" id="btnRoleAdmin"
            onclick="selectAdminRole(this)">Admin</button>
          <button type="button" class="role-btn role-dev" id="btnRoleMaster"
            onclick="notifyRoleDeveloping('Master')">Master</button>
          <button type="button" class="role-btn" id="btnRoleIntern" onclick="selectInternRole(this)">Thực tập
            sinh</button>
        </div>

        <!-- Form đăng nhập -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <!-- Hộp hiển thị lỗi khi tài khoản / vai trò không hợp lệ -->
          <div id="loginErrorMsg" class="login-error-msg"></div>

          <!-- Tên đăng nhập -->
          <div class="form-group">
            <label for="username">Tên đăng nhập / Email</label>
            <div class="input-box">
              <span class="icon">
                <img src="image/user.svg" alt="User">
              </span>
              <input type="text" id="username" placeholder="Nhập tên đăng nhập hoặc email" value="hr@company.vn"
                required>
            </div>
          </div>

          <!-- Mật khẩu -->
          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-box">
              <span class="icon">
                <img src="image/lock.svg" alt="Lock">
              </span>
              <input type="password" id="password" placeholder="Nhập mật khẩu" value="123456" required>
              <span class="toggle-eye" onclick="togglePass()" title="Hiện/ẩn mật khẩu">
                <img id="eyeIcon" src="image/eye.svg" alt="Hiện/ẩn mật khẩu">
              </span>
            </div>
          </div>

          <!-- Ghi nhớ & Quên mật khẩu -->
          <div class="form-row">
            <label class="remember">
              <input type="checkbox" id="rememberMe" checked> Ghi nhớ đăng nhập
            </label>
            <a href="javascript:void(0)" class="forgot-link"
              onclick="alert('Vui lòng liên hệ Quản trị viên để đặt lại mật khẩu.')">Quên mật khẩu?</a>
          </div>

          <!-- Nút Đăng nhập chính -->
          <button type="submit" class="btn-login" id="btnLoginSubmit">ĐĂNG NHẬP</button>
        </form>

        <!-- Dòng bảo mật cuối trang -->
        <div class="security-note">
          <img src="image/shield.svg" alt="Shield" width="16" height="16">
          <span>Bảo mật thông tin - An toàn dữ liệu</span>
        </div>
      </div>

    </div>
  </section>

  <!-- SCRIPTS -->
  <script src="api.js"></script>
  <script src="script.js"></script>
</body>

</html>
